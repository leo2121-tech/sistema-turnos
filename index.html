<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Turnos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<main class="container my-5">
    <h1 class="text-center mb-5 titulo-sistema">Sistema de Atención y Turnos</h1>
    
    <div class="row mt-4">
        <!-- Panel Público: Lo que ven las personas -->
        <div class="col-12 col-md-6 mb-4">
            <div class="card bg-dark text-white text-center p-4 mb-3 shadow panel-turno">
                <h2>Turno Actual</h2>
                <h1 class="display-1 fw-bold numero-gigante" id="turno-actual">---</h1>
                <h3 id="modulo-actual">Módulo ---</h3>
            </div>
            <div class="card p-3 shadow-sm border-0">
                <h4 class="text-secondary mb-3">En Espera</h4>
                <ul id="lista-espera" class="list-group">
                    <!-- JS inyectará los turnos aquí -->
                </ul>
            </div>
        </div>

        <!-- Panel del Operador: Lo que usas para administrar -->
        <div class="col-12 col-md-6 mb-4">
            <div class="card p-4 shadow-sm h-100 border-0">
                <h3 class="mb-4">Panel de Control</h3>
                <div id="contenedor-mensajes"></div>

                <form id="form-turno" class="mb-4 p-3 border rounded bg-white shadow-sm">
                    <h5 class="mb-3 text-secondary">Registrar Nuevo Turno</h5>

                    <div class="mb-3">
                        <label for="nombre-cliente" class="form-label">Nombre del Cliente</label>
                        <input type="text" id="nombre-cliente" class="form-control" placeholder="Ej. Juan Pérez">
                    </div>

                    <div class="mb-3">
                        <label for="tipo-atencion" class="form-label">Tipo de Atención</label>
                        <select id="tipo-atencion" class="form-select">
                            <option value="General">Atención General</option>
                            <option value="Preferencial">Atención Preferencial</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Obtener Nuevo Turno</button>
                </form>

                <hr>

                <button id="btn-llamar" class="btn btn-success btn-lg mb-4 shadow-sm w-100">Llamar Siguiente Turno</button>
                
                <hr>
                <h5 class="text-muted mb-3">Estadísticas de Gestión</h5>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fs-5">Personas en espera:</span>
                    <span id="contador-espera" class="badge bg-secondary fs-5">0</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fs-5">Personas atendidas:</span>
                    <span id="contador-atendidos" class="badge bg-success fs-5">0</span>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Tu JavaScript -->
<script src="js/app.js"></script>
</body>
</html>
