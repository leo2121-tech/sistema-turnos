services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-admin123}
      - PG_HOST=db_postgres
      - PG_DB=${PG_DB:-sistema_turnos}
      - PG_PORT=5432
      - MONGO_URI=mongodb://db_mongo:27017/turnos_db
    depends_on:
      - db_postgres
      - db_mongo

  db_postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-admin123}
      - POSTGRES_DB=${PG_DB:-sistema_turnos}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db_mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: