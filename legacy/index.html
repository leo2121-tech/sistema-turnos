<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Turnos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="container my-5">
    <header class="page-header mb-4">
        <div>
            <p class="eyebrow">Centro de atención</p>
            <h1 class="titulo-sistema">Sistema de Atención y Turnos</h1>
        </div>
    </header>

    <div class="row g-4 align-items-stretch">
        <!-- Panel Público -->
        <div class="col-12 col-lg-7">
            <section class="panel-turno card text-white text-center p-4 p-md-5">
                <div class="panel-topline">
                    <span class="status-dot"></span>
                    <span>Turno en vivo</span>
                </div>
                <h2 class="panel-label">Turno Actual</h2>
                <h1 class="display-1 fw-bold numero-gigante" id="turno-actual">---</h1>
                <div class="module-pill" id="modulo-actual">Módulo ---</div>
            </section>

            <section class="card list-panel p-3 p-md-4 mt-4">
                <div class="section-header mb-3">
                    <h4>En espera</h4>
                    <span class="chip-soft">Cola activa</span>
                </div>
                <ul id="lista-espera" class="list-group">
                    <!-- JS inyectará los turnos aquí -->
                </ul>
            </section>
        </div>

        <!-- Panel del Operador -->
        <div class="col-12 col-lg-5">
            <section class="card control-panel p-4 h-100">
                <div class="section-header mb-4">
                    <h3>Panel de control</h3>
                    <span class="chip-soft chip-primary">Operador</span>
                </div>
                <div id="contenedor-mensajes"></div>

                <form id="form-turno" class="mb-4 p-3 p-md-4 form-panel">
                    <h5 class="mb-3 form-title">Registrar nuevo turno</h5>

                    <div class="mb-3">
                        <label for="nombre-cliente" class="form-label">Nombre del cliente</label>
                        <input type="text" id="nombre-cliente" class="form-control" placeholder="">
                    </div>

                    <div class="mb-3">
                        <label for="tipo-atencion" class="form-label">Tipo de atención</label>
                        <select id="tipo-atencion" class="form-select">
                            <option value="General">Atención General</option>
                            <option value="Preferencial">Atención Preferencial</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Obtener Nuevo Turno</button>
                </form>

                <button id="btn-llamar" class="btn btn-success btn-lg mb-3 shadow-sm w-100 call-button">Llamar Siguiente Turno</button>
                <button id="btn-reiniciar" class="btn btn-outline-secondary mb-4 w-100 reset-button">Reiniciar sistema</button>

                <div class="stats-box">
                    <h5>Estadísticas</h5>
                    <div class="stat-row">
                        <span>Personas en espera</span>
                        <span id="contador-espera" class="badge badge-neutral">0</span>
                    </div>
                    <div class="stat-row">
                        <span>Personas atendidas</span>
                        <span id="contador-atendidos" class="badge badge-success">0</span>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<!-- Tu JavaScript -->
<script src="js/app.js"></script>
</body>
</html>
